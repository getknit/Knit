name: Triage

# Keyword auto-labeling for newly opened issues, so a report lands with an `area:` / `dist:` tag
# instead of only `needs-triage`. Advisory only: this workflow never removes a label, never closes
# anything, and never comments. Canned replies and closes live in .github/label-actions.yml and are
# driven by labels a human applies.
#
# Runs on `opened` ONLY, deliberately not `edited`. An `edited` run would re-add labels the
# maintainer had just removed by hand, and there is no way to distinguish "the regex was wrong" from
# "the text changed". Hand-labeling wins after the first pass.
#
# Matching runs over the title plus a SCRUBBED body: issue-form headings (`### ...`) and UNCHECKED
# checkbox lines are stripped first. The forms in .github/ISSUE_TEMPLATE render their own scaffolding
# into every single issue ("### Scope and mesh impact", "- [ ] Changes the end-to-end crypto
# envelope", ...), so a naive regex would tag every feature request `area: crypto` and every bug
# `area: mesh`. Checked boxes survive the scrub on purpose — those are a real signal.
#
# Third-party and first-party actions alike are pinned by commit SHA here because this job holds
# `issues: write` and is triggered by anyone who can open an issue. (ci.yml / release.yml pin by
# major tag; they run only on maintainer-controlled refs.)

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    name: Auto-label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            // GitHub delivers issue bodies with CRLF; normalize before any line-anchored matching.
            const body = (issue.body || '').replace(/\r\n?/g, '\n');

            const scrubbed = [
              issue.title || '',
              ...body
                .split('\n')
                .filter((l) => !/^\s{0,3}#{1,6}\s/.test(l))        // form headings
                .filter((l) => !/^\s*[-*]\s*\[\s*\]\s/.test(l)),   // UNCHECKED checkbox boilerplate
            ].join('\n');

            const RULES = [
              ['area: wifi-aware', /wi-?fi[\s-]?aware|\bNAN\b|\bNDPs?\b|\bNDIs?\b|\bAware session\b/i],
              ['area: ble',        /\bBLE\b|bluetooth|\bL2CAP\b|\bGATT\b|\bPSM\b|advertis(e|ing|er)/i],
              ['area: mesh',       /store[- ]and[- ]forward|custody|convergence|\bCBOR\b|wire format|forward_store|\bhops?\b|reachab/i],
              ['area: crypto',     /\bcrypto\b|encrypt|\bX25519\b|\bEd25519\b|key exchange|safety number/i],
              ['area: ui',         /\bUI\b|\bcompose\b|composable|\bscreen\b|\btheme\b|dark mode|splash|\bicons?\b|accessib|talkback/i],
              ['area: build',      /\bgradle\b|\bAGP\b|lockfile|detekt|ktlint|\bJDK\b|compileSdk|\bproguard\b|\bR8\b/i],
              ['dist: fdroid',     /f-?droid|reproducible build/i],
              ['dist: play',       /play store|google play|play console|pre-?launch report/i],
            ];

            const labels = new Set(
              RULES.filter(([, re]) => re.test(scrubbed)).map(([name]) => name),
            );

            // The bug form's "Radios involved" dropdown beats prose. "Both" means both planes.
            const radios = /^###\s*Radios involved\s*$\n+^(.+)$/m.exec(body);
            if (radios && radios[1].trim() === 'Both') {
              labels.add('area: ble');
              labels.add('area: wifi-aware');
            }

            if (labels.size === 0) {
              core.info(`no keyword match on #${issue.number}; leaving to manual triage`);
              return;
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: [...labels],
            });
            core.info(`labeled #${issue.number}: ${[...labels].join(', ')}`);
